name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      AST_CORE_ORIGIN: https://api-ci.example.invalid
      AST_RELAY_ORIGIN: https://relay-ci.example.invalid
      AST_AUTH_ORIGIN: https://auth-ci.example.invalid
      AST_DASHBOARD_ORIGIN: https://dashboard-ci.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dashboard.artisan.st
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      AST_CORE_ORIGIN: https://api.artisan.st
      AST_RELAY_ORIGIN: https://relay.editor.artisan.st
      AST_AUTH_ORIGIN: https://auth.artisan.st
      AST_DASHBOARD_ORIGIN: https://dashboard.artisan.st
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy tested commit
        run: pnpm --dir infra run deploy --stage prod --yes --no-input
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
