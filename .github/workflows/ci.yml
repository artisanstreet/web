name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      AST_CORE_ORIGIN: https://api-ci.example.invalid
      AST_RELAY_ORIGIN: https://relay-ci.example.invalid
      AST_AUTH_ORIGIN: https://auth-ci.example.invalid
      AST_DASHBOARD_ORIGIN: https://dashboard-ci.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
